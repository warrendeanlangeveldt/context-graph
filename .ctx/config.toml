# Context Graph configuration. See docs/design-spec.md §17.
[repo]
ratifiers = ["warren.langeveldt"]            # git identities (email local part or name) allowed to ratify concepts and enforced constraints
default_branch = "main"

[slice]
enabled = true            # true | false (observe-only) | "random:0.5"
max_tokens = 300
max_decisions = 4
hydrate_on_prompt = false # true: hydrate the files and module ids a prompt names before the model sees it (hydrate_budget bounds it)
hydrate_budget = 1500

[record]
max_blocks = 2
demand = true             # false: record the gap as a finding instead of holding the turn open

[observe]
shell_parsing = true
forward = false

[gate]
stale_basis = "warn"
context_moved = "warn"

[embed]
enabled = true
provider = "minilm"       # in-process; or local:<ollama-model>, openai:<model>, <url>#<model>
min_score = 0.45          # cosine threshold; MiniLM scores related passages around 0.45 to 0.6
include = ["docs/**/*.md"]
exclude = ["**/generated/**", "**/*.lock", "**/package-lock.json"]
in_process_hooks = false  # hints in hooks come from a running ctx serve; set true to embed inside each hook instead

[init]
packs = ["auto"]
